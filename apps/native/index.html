<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sakdulur</title>
    <!--
      The app (src/main.tsx). The splash below is drawn at once, before the script loads, and removed after the
      first screen. next-themes adds the theme class; this sets it first so the splash and the first screen match.
    -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        var dark = theme === "dark" || ((!theme || theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        if (/^(id|in)\b/i.test(localStorage.getItem("sakdulur-locale") || navigator.language)) document.documentElement.lang = "id";
      } catch (e) {}
    </script>
    <style>
      #splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #f9f6ef; color: #3a3128; font: 600 1.5rem/1.2 Georgia, "Times New Roman", serif; }
      .dark #splash { background: #221d18; color: #f2ede4; }
      #splash svg { width: 72px; height: 72px; margin-bottom: 14px; }
    </style>
  </head>
  <body class="min-h-dvh">
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#3f7a52"/><circle cx="16" cy="11" r="4" fill="#fbf7ee"/><circle cx="9.5" cy="21" r="3.2" fill="#fbf7ee" opacity=".85"/><circle cx="22.5" cy="21" r="3.2" fill="#fbf7ee" opacity=".85"/><path d="M16 15v3.5M16 18.5l-5 1.5M16 18.5l5 1.5" stroke="#fbf7ee" stroke-width="1.6" stroke-linecap="round" fill="none"/><rect x="13" y="25.5" width="6" height="2" rx="1" fill="#c9714a"/></svg>
      Sakdulur
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
