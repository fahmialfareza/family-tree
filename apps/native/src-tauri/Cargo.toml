[package]
name = "sakdulur"
version = "0.1.0"
description = "Sakdulur for desktop and mobile: a native shell around sakdulur.com"
authors = ["Fahmi Alfareza"]
edition = "2021"

[lib]
name = "sakdulur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Windows and Linux deliver deep links by starting a second instance; this hands them to the running one.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
